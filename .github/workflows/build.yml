name: Build DME-Checkout.exe

on:
  push:
    branches: [main, master, Remote]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build .exe
        run: pyinstaller build.spec --clean --noconfirm

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "dist/DME-Checkout.exe" -Algorithm SHA256).Hash
          "$hash  DME-Checkout.exe" | Out-File -Encoding ascii -FilePath "dist/SHA256 checksums.txt"
          Get-Content "dist/SHA256 checksums.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DME-Checkout
          path: |
            dist/DME-Checkout.exe
            dist/SHA256 checksums.txt

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DME-Checkout.exe
            dist/SHA256 checksums.txt
