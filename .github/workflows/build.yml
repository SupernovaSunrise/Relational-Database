name: Build DME-Checkout

on:
  push:
    branches: [main, master, Remote]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYINSTALLER_COMPILE_BOOTLOADER: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install InnoSetup -y

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build PyInstaller bootloader from source
        run: pip install --force-reinstall --no-binary=PyInstaller PyInstaller

      - name: Build .exe (onedir)
        run: pyinstaller build.spec --clean --noconfirm

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" inno_setup.iss

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash -Path "dist/DME-Checkout/DME-Checkout.exe" -Algorithm SHA256).Hash
          "$exeHash  DME-Checkout.exe" | Out-File -Encoding ascii -FilePath "dist/SHA256 checksums.txt"
          if (Test-Path "installer/DME-Checkout-Setup.exe") {
            $setupHash = (Get-FileHash -Path "installer/DME-Checkout-Setup.exe" -Algorithm SHA256).Hash
            "$setupHash  DME-Checkout-Setup.exe" | Out-File -Encoding ascii -Append -FilePath "dist/SHA256 checksums.txt"
          }
          Get-Content "dist/SHA256 checksums.txt"

      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: DME-Checkout
          path: dist/DME-Checkout/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DME-Checkout-Setup
          path: installer/DME-Checkout-Setup.exe

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256-checksums
          path: dist/SHA256 checksums.txt

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/DME-Checkout-Setup.exe
            dist/SHA256 checksums.txt
