services:
  dme-app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - dme-data:/app/data
      - ./backups:/app/backups
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - DB_PATH=/app/data/database.db
    restart: unless-stopped
    container_name: dme-checkout-app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    develop:
      watch:
        - action: sync
          path: ./web_app.py
          target: /app/web_app.py
        - action: sync
          path: ./db.py
          target: /app/db.py
        - action: sync
          path: ./templates
          target: /app/templates
        - action: rebuild
          path: ./requirements.txt

volumes:
  dme-data:
