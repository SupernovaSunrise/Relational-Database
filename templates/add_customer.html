{% extends "base.html" %}

{% block title %}Add Customer - Equipment Checkout Database{% endblock %}

{% block content %}
<h1>Add New Customer</h1>

<form method="POST">
    <div class="form-group">
        <label for="name">Customer Name:</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g., (555) 123-4567" required>
    </div>

    <div class="form-group">
        <label for="zip_code">Zip Code:</label>
        <input type="text" id="zip_code" name="zip_code" placeholder="12345" required>
    </div>

    <button type="submit" class="btn">Add Customer</button>
    <a href="{{ url_for('customers') }}" class="btn" style="margin-left: 10px;">Cancel</a>
</form>

<script>
function normalizePhoneInput(value) {
    return (value || '').toString().replace(/\D/g, '');
}
function formatPhoneInput(value) {
    var digits = normalizePhoneInput(value);
    if (digits.length === 11 && digits.startsWith('1')) {
        digits = digits.slice(1);
    }
    if (digits.length !== 10) {
        return value;
    }
    return '(' + digits.slice(0, 3) + ') ' + digits.slice(3, 6) + '-' + digits.slice(6);
}
var phoneInput = document.getElementById('phone');
if (phoneInput) {
    phoneInput.addEventListener('blur', function() {
        this.value = formatPhoneInput(this.value);
    });
}
</script>
{% endblock %}
