{% extends "base.html" %}

{% block title %}Add Equipment - Equipment Checkout Database{% endblock %}

{% block content %}
<h1>Add New Equipment</h1>

<form method="POST">
    <div class="form-group">
        <label for="equipment_id">Equipment ID (AA-0000 format):</label>
        <input type="text" id="equipment_id" name="equipment_id" placeholder="e.g., AB-1234" required>
    </div>

    <div class="form-group">
        <label for="item_name">Item Name:</label>
        <input type="text" id="item_name" name="item_name" placeholder="e.g., Wheelchair" required>
    </div>

    <button type="submit" class="btn">Add Equipment</button>
    <a href="{{ url_for('equipment') }}" class="btn" style="margin-left: 10px;">Cancel</a>
</form>
{% endblock %}
