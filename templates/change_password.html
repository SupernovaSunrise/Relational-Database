{% extends "base.html" %}
{% block title %}Change Password - DME Checkout{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
    <h2>Change Password</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input type="password" id="current_password" name="current_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required minlength="8">
            <small style="color: #666;">Minimum 8 characters</small>
        </div>
        <div class="form-group">
            <label for="new_password2">Confirm New Password</label>
            <input type="password" id="new_password2" name="confirm_password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Update Password</button>
        <a href="{{ url_for('master_control') }}" class="btn" style="width: 100%; text-align: center; margin-top: 10px; display: block;">Cancel</a>
    </form>
</div>
{% endblock %}
