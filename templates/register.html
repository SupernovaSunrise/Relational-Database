{% extends "base.html" %}
{% block title %}Create Account - DME Checkout{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
    <h2 style="text-align: center;">Create Admin Account</h2>
    <p style="text-align: center; color: #666;">This is the first time the application is running. Create an administrator account to get started.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">
            <small style="color: #666;">Minimum 8 characters</small>
        </div>
        <div class="form-group">
            <label for="password2">Confirm Password</label>
            <input type="password" id="password2" name="confirm_password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Create Account</button>
    </form>
</div>
{% endblock %}
